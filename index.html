<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GTA 6 Retro Phone - Interactive</title>
    <style>
        :root { --focus-color: #fcee0a; }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; height: 100vh; background-color: #111; overflow: hidden;
            display: flex; justify-content: center; align-items: center; font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* 白色机身 */
        .gta-phone {
            width: 96vw; max-width: 380px; height: 92vh; max-height: 800px;
            background: #f7f7f7; border-radius: 35px; border: 2px solid #ddd;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 -5px 15px rgba(0,0,0,0.1);
            position: relative; display: flex; flex-direction: column; padding: 15px 10px 25px 10px;
        }

        /* 屏幕区域 */
        .screen {
            width: 100%; height: 100%; background: #000; border-radius: 4px;
            border: 2px solid #333; position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            height: 24px; color: #fff; font-size: 12px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center; padding: 0 10px;
            position: absolute; top: 0; left: 0; right: 0; z-index: 100; text-shadow: 1px 1px 2px #000;
        }

        /* === 视图1：桌面 === */
        .view-home {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
            display: flex; flex-direction: column; padding: 30px 10px 0 10px;
            background: url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=800&auto=format&fit=crop') center/cover no-repeat;
        }
        .view-home::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4); z-index: -1;
        }
        .view-home.hidden { display: none; }

        /* Widgets */
        .widgets { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; margin-top: 10px; }
        .widget-main, .widget-weather {
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
            border-radius: 10px; padding: 10px 15px; color: #fff; border: 1px solid rgba(255,255,255,0.1);
        }
        .widget-header { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .widget-dot { width: 10px; height: 10px; background: #ff2a6d; border-radius: 50%; }
        .widget-sub { font-size: 11px; color: #aaa; margin-top: 4px; margin-left: 18px; }
        .widget-weather { display: flex; justify-content: space-between; align-items: center; width: 60%; }
        .widget-weather .temp { font-size: 18px; font-weight: bold; margin-right: 5px;}

        /* 图标网格 */
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px 10px; flex-grow: 1; align-content: start; }
        .app-icon {
            width: 100%; aspect-ratio: 1; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px;
            border: 2px solid transparent; transition: all 0.15s; box-shadow: inset 0 -3px 8px rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.5);
            position: relative;
        }
        .app-icon::after {
            content: ''; position: absolute; top: 5%; left: 5%; width: 90%; height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.7), transparent); border-radius: 50%;
        }
        .app-icon.focused { border-color: var(--focus-color); transform: scale(1.1); box-shadow: 0 0 15px var(--focus-color); z-index: 10; }

        /* 底部胶囊 */
        .bottom-dock {
            margin: 10px auto 15px auto; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            padding: 8px 30px; border-radius: 20px; color: #fff; font-size: 13px; font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2); min-width: 120px; text-align: center;
        }

        /* === 视图2：社交媒体 App === */
        .view-app {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #111; z-index: 5;
            display: flex; flex-direction: column; padding-top: 24px; /* 避开状态栏 */
        }
        .view-app.hidden { display: none; }
        
        .app-header { background: #222; color: #fff; padding: 10px; font-size: 14px; font-weight: bold; border-bottom: 1px solid #333; text-align: center; }
        .app-content { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        /* 帖子样式 */
        .post { background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .post-img { width: 100%; height: 180px; background: #333; object-fit: cover; }
        .post-body { padding: 10px; }
        .post-user { color: #fff; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .post-text { color: #ccc; font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
        
        /* 交互按钮 */
        .action-row { display: flex; gap: 10px; }
        .action-btn {
            background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 15px; border-radius: 15px;
            font-size: 12px; font-weight: bold; transition: all 0.2s;
        }
        .action-btn.focused { border-color: var(--focus-color); color: var(--focus-color); background: #111; box-shadow: 0 0 10px rgba(252, 238, 10, 0.3); }

        /* 评论列表 */
        .comments-list { background: #111; padding: 10px; font-size: 12px; color: #888; border-top: 1px solid #333; }
        .comment-item { margin-bottom: 5px; }
        .comment-item span { color: #0f0; font-weight: bold; } /* 绿色名字 */

        /* === 视图3：复古侧键键盘 === */
        .view-keyboard {
            position: absolute; bottom: 0; left: 0; right: 0; background: #222; z-index: 10;
            display: flex; flex-direction: column; padding: 5px; border-top: 2px solid #444;
        }
        .view-keyboard.hidden { display: none; }
        
        /* 输入框 */
        .input-display {
            background: #000; color: #0f0; padding: 10px; font-family: monospace; font-size: 16px;
            border: 1px solid #333; margin-bottom: 5px; min-height: 40px; word-break: break-all;
        }
        .input-display::after { content: '_'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 键盘网格 */
        .keyboard-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
        }
        .k-key {
            background: #333; color: #fff; text-align: center; padding: 8px 0; border-radius: 4px;
            font-size: 14px; font-weight: bold; border: 1px solid #444;
        }
        .k-key.focused { border-color: var(--focus-color); background: #111; box-shadow: inset 0 0 8px var(--focus-color); }
        .k-key.span-2 { grid-column: span 2; }
        .k-key.span-3 { grid-column: span 3; }
        .k-key.span-6 { grid-column: span 6; background: #444; color: var(--focus-color); }

        /* 侧边按键 */
        .side-buttons { position: absolute; right: -15px; top: 25%; height: 250px; width: 15px; display: flex; flex-direction: column; gap: 15px; z-index: 999;}
        .side-btn { width: 100%; background: linear-gradient(90deg, #bbb, #eee); border-radius: 0 4px 4px 0; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; color: #333; font-size: 10px; cursor: pointer; writing-mode: vertical-rl; font-weight: bold; }
        .side-btn:active, .side-btn.pressed { transform: translateX(-3px); background: #999; }
        .side-btn.vol-up { height: 80px; border-radius: 4px 4px 0 0; }
        .side-btn.vol-down { height: 80px; border-radius: 0 0 4px 4px; }
        .side-btn.power { height: 60px; margin-top: 10px; }
        
        .physical-home { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 40px; height: 12px; border-radius: 10px; background: #333; }
    </style>
</head>
<body>

    <div class="gta-phone">
        <!-- 物理按键 -->
        <div class="side-buttons">
            <div class="side-btn vol-up" id="btn-left">左/上</div>
            <div class="side-btn vol-down" id="btn-right">右/下</div>
            <div class="side-btn power" id="btn-confirm">确认</div>
        </div>

        <div class="screen">
            <div class="status-bar">
                <span>1:47 pm</span>
                <span>📶 🔋</span>
            </div>

            <!-- 视图1：桌面 -->
            <div class="view-home" id="view-home">
                <div class="widgets">
                    <div class="widget-main">
                        <div class="widget-header"><div class="widget-dot"></div> 提醒事项</div>
                        <div class="widget-sub">2条通知</div>
                    </div>
                    <div class="widget-weather">
                        <div><span class="temp">28°</span><span style="font-size:11px;">Vice City</span></div>
                        <div style="font-size: 16px;">⛅</div>
                    </div>
                </div>

                <div class="app-grid" id="app-grid">
                    <div class="app-icon" style="background:#8ecae6;" data-name="天气">☀️</div>
                    <div class="app-icon" style="background:#2a9d8f;" data-name="电话">📞</div>
                    <div class="app-icon" style="background:#333;" data-name="相机">📷</div>
                    <div class="app-icon" style="background:#3a0ca3;" data-name="地图">🗺️</div>
                    <!-- 下面这个就是社交软件 -->
                    <div class="app-icon" style="background:#f8edeb;" data-name="相册/社交" data-app="social">🖼️</div>
                    <div class="app-icon" style="background:#f4a261;" data-name="便签">📝</div>
                    <div class="app-icon" style="background:#e63946;" data-name="邮件">✉️</div>
                    <div class="app-icon" style="background:#a2d2ff;" data-name="云端">☁️</div>
                    <div class="app-icon" style="background:#f72585;" data-name="指南针">🧭</div>
                    <div class="app-icon" style="background:#e9ecef;" data-name="设置">⚙️</div>
                </div>
                <div class="bottom-dock" id="text-display">天气</div>
            </div>

            <!-- 视图2：社交 App -->
            <div class="view-app hidden" id="view-social">
                <div class="app-header">Snapmatic</div>
                <div class="app-content">
                    <div class="post">
                        <!-- 那个后备箱图 -->
                        <img class="post-img" src="https://images.unsplash.com/photo-1542282088-fe8426682b8f?q=80&w=600&auto=format&fit=crop" alt="Trunk">
                        <div class="post-body">
                            <div class="post-user">@Swampinator</div>
                            <div class="post-text">看看是哪个倒霉蛋后备箱里塞了一大波能让人……</div>
                            <div class="action-row" id="social-actions">
                                <div class="action-btn" data-action="like">❤️ 155</div>
                                <div class="action-btn" data-action="comment">💬 写评论</div>
                            </div>
                        </div>
                        <!-- 评论显示区 -->
                        <div class="comments-list" id="comments-list">
                            <div class="comment-item"><span>@LucidCity:</span> 这哥们彻底疯了。</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 视图3：侧键键盘 -->
            <div class="view-keyboard hidden" id="view-keyboard">
                <div class="input-display" id="input-display"></div>
                <div class="keyboard-grid" id="keyboard-grid">
                    <!-- 字母将由JS生成 -->
                </div>
            </div>

        </div>
        <div class="physical-home"></div>
    </div>

    <script>
        // 状态管理
        let currentView = 'home'; // 'home', 'social', 'keyboard'
        let focusGroup = []; // 当前能聚焦的元素列表
        let focusIndex = 0;
        
        // 元素
        const homeIcons = document.querySelectorAll('#app-grid .app-icon');
        const socialBtns = document.querySelectorAll('#social-actions .action-btn');
        const kGrid = document.getElementById('keyboard-grid');
        
        let currentText = "";
        let isLiked = false;

        // 震动
        function vibrate() { if (navigator.vibrate) navigator.vibrate(30); }

        // 更新焦点 UI
        function updateFocusUI() {
            // 清除所有焦点
            document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
            // 添加新焦点
            if (focusGroup.length > 0 && focusGroup[focusIndex]) {
                focusGroup[focusIndex].classList.add('focused');
            }
        }

        // 设置新的焦点组
        function setFocusGroup(elements, index = 0) {
            focusGroup = Array.from(elements);
            focusIndex = index;
            updateFocusUI();
        }

        // --- 视图切换逻辑 ---
        
        function goHome() {
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('view-social').classList.add('hidden');
            document.getElementById('view-keyboard').classList.add('hidden');
            currentView = 'home';
            setFocusGroup(homeIcons, 0);
            // 恢复底部文字
            document.getElementById('text-display').innerText = focusGroup[focusIndex].getAttribute('data-name');
        }

        // --- 桌面操作 ---
        function homeAction(direction, isConfirm) {
            if (isConfirm) {
                vibrate();
                const target = focusGroup[focusIndex];
                if (target.getAttribute('data-app') === 'social') {
                    document.getElementById('view-home').classList.add('hidden');
                    document.getElementById('view-social').classList.remove('hidden');
                    currentView = 'social';
                    setFocusGroup(socialBtns, 0);
                } else {
                    const textDisplay = document.getElementById('text-display');
                    textDisplay.innerText = `正在打开: ${target.getAttribute('data-name')}`;
                    setTimeout(() => { if(currentView==='home') textDisplay.innerText = focusGroup[focusIndex].getAttribute('data-name'); }, 1000);
                }
            } else {
                vibrate();
                focusIndex = (focusIndex + direction + focusGroup.length) % focusGroup.length;
                updateFocusUI();
                document.getElementById('text-display').innerText = focusGroup[focusIndex].getAttribute('data-name');
            }
        }

        // --- 社交软件操作 ---
        function socialAction(direction, isConfirm) {
            if (isConfirm) {
                vibrate();
                const action = focusGroup[focusIndex].getAttribute('data-action');
                if (action === 'like') {
                    if (!isLiked) {
                        focusGroup[focusIndex].innerText = '❤️ 156';
                        focusGroup[focusIndex].style.color = '#ff2a6d';
                        isLiked = true;
                    } else {
                        focusGroup[focusIndex].innerText = '❤️ 155';
                        focusGroup[focusIndex].style.color = '';
                        isLiked = false;
                    }
                } else if (action === 'comment') {
                    // 打开键盘
                    document.getElementById('view-keyboard').classList.remove('hidden');
                    currentView = 'keyboard';
                    currentText = "";
                    document.getElementById('input-display').innerText = "";
                    // 默认聚焦第一个字母
                    setFocusGroup(document.querySelectorAll('.k-key'), 0);
                }
            } else {
                vibrate();
                focusIndex = (focusIndex + direction + focusGroup.length) % focusGroup.length;
                updateFocusUI();
            }
        }

        // --- 键盘打字操作 ---
        function keyboardAction(direction, isConfirm) {
            if (isConfirm) {
                vibrate();
                const target = focusGroup[focusIndex];
                const key = target.getAttribute('data-key');
                
                if (key === 'ENTER') {
                    // 发送评论
                    if (currentText.trim() !== "") {
                        const cList = document.getElementById('comments-list');
                        const newC = document.createElement('div');
                        newC.className = 'comment-item';
                        newC.innerHTML = `<span>@Player:</span> ${currentText}`;
                        cList.appendChild(newC);
                        
                        // 关闭键盘
                        document.getElementById('view-keyboard').classList.add('hidden');
                        currentView = 'social';
                        setFocusGroup(socialBtns, 1); // 停留在评论按钮
                    }
                } else if (key === 'DEL') {
                    currentText = currentText.slice(0, -1);
                    document.getElementById('input-display').innerText = currentText;
                } else if (key === 'SPACE') {
                    currentText += " ";
                    document.getElementById('input-display').innerText = currentText;
                } else {
                    currentText += key;
                    document.getElementById('input-display').innerText = currentText;
                }
            } else {
                vibrate();
                // 键盘移动：由于是网格，我们简单处理上下左右
                // 为了方便纯侧键，我们直接左(-1) 右(+1)
                focusIndex = (focusIndex + direction + focusGroup.length) % focusGroup.length;
                updateFocusUI();
            }
        }

        // --- 全局侧键入口 ---
        function handleKey(direction, isConfirm) {
            if (currentView === 'home') homeAction(direction, isConfirm);
            else if (currentView === 'social') socialAction(direction, isConfirm);
            else if (currentView === 'keyboard') keyboardAction(direction, isConfirm);
        }

        // --- 初始化键盘 ---
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        letters.forEach(l => {
            const div = document.createElement('div');
            div.className = 'k-key';
            div.setAttribute('data-key', l);
            div.innerText = l;
            kGrid.appendChild(div);
        });
        // 添加特殊键
        const spaceBtn = document.createElement('div');
        spaceBtn.className = 'k-key span-3';
        spaceBtn.setAttribute('data-key', 'SPACE');
        spaceBtn.innerText = '空格';
        kGrid.appendChild(spaceBtn);

        const delBtn = document.createElement('div');
        delBtn.className = 'k-key span-3';
        delBtn.setAttribute('data-key', 'DEL');
        delBtn.innerText = '删除';
        kGrid.appendChild(delBtn);

        const enterBtn = document.createElement('div');
        enterBtn.className = 'k-key span-6';
        enterBtn.setAttribute('data-key', 'ENTER');
        enterBtn.innerText = '发送评论 (长按确认键退出)';
        kGrid.appendChild(enterBtn);

        // 初始化
        setFocusGroup(homeIcons, 0);

        // --- 物理侧键事件绑定 ---
        document.getElementById('btn-left').addEventListener('pointerdown', (e) => {
            e.preventDefault(); e.target.classList.add('pressed');
            handleKey(-1, false);
        });
        document.getElementById('btn-left').addEventListener('pointerup', (e) => e.target.classList.remove('pressed'));
        document.getElementById('btn-left').addEventListener('pointerleave', (e) => e.target.classList.remove('pressed'));

        document.getElementById('btn-right').addEventListener('pointerdown', (e) => {
            e.preventDefault(); e.target.classList.add('pressed');
            handleKey(1, false);
        });
        document.getElementById('btn-right').addEventListener('pointerup', (e) => e.target.classList.remove('pressed'));
        document.getElementById('btn-right').addEventListener('pointerleave', (e) => e.target.classList.remove('pressed'));

        // 确认键 + 长按退出
        let holdTimer = null;
        document.getElementById('btn-confirm').addEventListener('pointerdown', (e) => {
            e.preventDefault(); e.target.classList.add('pressed');
            
            // 设定长按 0.8 秒返回桌面
            holdTimer = setTimeout(() => {
                if (currentView !== 'home') {
                    vibrate();
                    goHome();
                    // 震动两次代表已返回
                    setTimeout(()=>{ if(navigator.vibrate) navigator.vibrate([30,50,30]); }, 100);
                }
            }, 800);
            
            // 短按
            handleKey(0, true);

        });
        document.getElementById('btn-confirm').addEventListener('pointerup', (e) => {
            e.target.classList.remove('pressed');
            clearTimeout(holdTimer); // 如果松手了，取消长按
        });
        document.getElementById('btn-confirm').addEventListener('pointerleave', (e) => {
            e.target.classList.remove('pressed');
            clearTimeout(holdTimer);
        });

    </script>
</body>
</html>
